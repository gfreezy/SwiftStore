name: Release swiftstore CLI

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (e.g. 1.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-cli-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS arm64
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and host
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(uname -m)" = arm64
          swift --version

      - name: Build release binary
        run: swift build -c release --product swiftstore

      - name: Package and smoke test standalone binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist "$RUNNER_TEMP/swiftstore-package"
          cp .build/release/swiftstore "$RUNNER_TEMP/swiftstore-package/swiftstore"
          chmod +x "$RUNNER_TEMP/swiftstore-package/swiftstore"
          lipo "$RUNNER_TEMP/swiftstore-package/swiftstore" -verify_arch arm64
          "$RUNNER_TEMP/swiftstore-package/swiftstore" --help
          (
            cd Examples/VersionedMigrations
            "$RUNNER_TEMP/swiftstore-package/swiftstore" migration check
          )
          # The uploaded binary must not depend on build-directory dylibs.
          otool -L "$RUNNER_TEMP/swiftstore-package/swiftstore" > "$RUNNER_TEMP/swiftstore-libraries.txt"
          if grep -E '/\.build/|@rpath/libSwiftStore|@rpath/libSwiftSyntax' "$RUNNER_TEMP/swiftstore-libraries.txt"; then
            echo 'error: CLI contains nonportable library dependencies' >&2
            exit 1
          fi
          tar -czf "dist/swiftstore-${RELEASE_TAG}-macos-arm64.tar.gz" -C "$RUNNER_TEMP/swiftstore-package" swiftstore
          (
            cd dist
            shasum -a 256 "swiftstore-${RELEASE_TAG}-macos-arm64.tar.gz" > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )

      - name: Save workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: swiftstore-macos-arm64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          # Draft first so a new release becomes visible only after both assets are present.
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false
          fi

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swiftstore-download"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/swiftstore-download" \
            --pattern "swiftstore-${RELEASE_TAG}-macos-arm64.tar.gz" --pattern SHA256SUMS
          (
            cd "$RUNNER_TEMP/swiftstore-download"
            shasum -a 256 -c SHA256SUMS
            tar -xzf "swiftstore-${RELEASE_TAG}-macos-arm64.tar.gz"
            ./swiftstore --help
          )
